<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grand Internet Services (GIS) | High-Speed Fiber Internet & IT Solutions</title>
    
    <!-- Intensive Google SEO Meta Tags -->
    <meta name="description" content="Grand Internet Services (GIS) is a premier technology provider delivering lightning-fast fiber internet connection, robust cybersecurity frameworks, state-of-the-art cloud solutions, and enterprise networks with 24/7 technical support." />
    <meta name="keywords" content="Grand Internet Services, GIS, High-Speed Internet, Fiber Broadband, Reliable ISP, IT consulting, Cybersecurity, Network solutions, Corporate Bandwidth, Enterprise Cloud Solutions, Cloud Integration" />
    <meta name="author" content="Grand Internet Services" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    
    <!-- Open Graph Meta Tags (Facebook, LinkedIn, WhatsApp, Google Preview) -->
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Grand Internet Services (GIS) | High-Speed Fiber Internet & IT Solutions" />
    <meta property="og:description" content="Elevate your connectivity with Grand Internet Services. Delivering lightning-fast fiber internet and premium IT solutions backed by robust cybersecurity frameworks." />
    <meta property="og:site_name" content="Grand Internet Services" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Grand Internet Services (GIS) | High-Speed Fiber Internet & IT Solutions" />
    <meta name="twitter:description" content="Elevate your connectivity with Grand Internet Services. Delivering lightning-fast fiber internet and premium IT solutions backed by robust cybersecurity frameworks." />

    <!-- Google SEO Structured Data (Schema.org JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Grand Internet Services",
      "alternateName": "GIS",
      "description": "Grand Internet Services (GIS) is a leading internet service provider delivering high-speed voice, robust data, managed cybersecurity, and state-of-the-art cloud architecture solutions designed for seamless residential and commercial performance.",
      "contactPoint": [
        {
          "@type": "ContactPoint",
          "telephone": "+2348037376043",
          "contactType": "technical support",
          "email": "gsunical@gmail.com",
          "availableLanguage": "English"
        }
      ]
    }
    </script>
  </head>
  <body>
    <!-- Full-screen WiFi Buffering Preloader Overlay -->
    <div id="preloader" style="position: fixed; inset: 0; background: #ffffff; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.35s ease-in-out, visibility 0.35s ease-in-out;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 24px;">
        <!-- High-fidelity Custom SVG WiFi Signal Buffering Indicator -->
        <svg width="84" height="84" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="transform: translateY(2px);">
          <!-- Central Dot in Black -->
          <circle cx="12" cy="18" r="1.6" fill="#000000" style="animation: wifi-pulse-ani-rapid 0.8s infinite ease-in-out; animation-delay: 0s; transform-origin: 12px 18px;" />
          <!-- Inner curved segment in Deep Red -->
          <path d="M9 15C10.6569 13.3431 13.3431 13.3431 15 15" stroke="#990000" stroke-width="2.3" stroke-linecap="round" style="animation: wifi-pulse-ani-rapid 0.8s infinite ease-in-out; animation-delay: 0.12s; transform-origin: 12px 18px;" />
          <!-- Mid curved segment in Black -->
          <path d="M6 12C9.31371 8.68629 14.6863 8.68629 18 12" stroke="#000000" stroke-width="2.3" stroke-linecap="round" style="animation: wifi-pulse-ani-rapid 0.8s infinite ease-in-out; animation-delay: 0.24s; transform-origin: 12px 18px;" />
          <!-- Outer curved segment in Deep Red -->
          <path d="M3 9C7.97056 4.02944 16.0294 4.02944 21 9" stroke="#990000" stroke-width="2.3" stroke-linecap="round" style="animation: wifi-pulse-ani-rapid 0.8s infinite ease-in-out; animation-delay: 0.36s; transform-origin: 12px 18px;" />
        </svg>
        <div style="text-align: center; display: flex; flex-direction: column; gap: 6px;">
          <span style="font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 800; color: #000000; letter-spacing: 0.35em; text-transform: uppercase;">
            GRAND INTERNET
          </span>
          <span style="font-family: system-ui, -apple-system, sans-serif; font-size: 8px; font-weight: 700; color: #990000; letter-spacing: 0.22em; text-transform: uppercase;">
            LIGHTNING PORTAL CONNECTING...
          </span>
        </div>
      </div>
    </div>

    <style>
      @keyframes wifi-pulse-ani-rapid {
        0%, 100% {
          opacity: 0.12;
          transform: scale(0.96);
        }
        25% {
          opacity: 1;
          transform: scale(1.04);
        }
        50% {
          opacity: 0.12;
          transform: scale(0.96);
        }
      }
    </style>

    <script>
      // Smooth slow-buffered fade-out after resources have completed loading
      window.addEventListener('load', function() {
        const loader = document.getElementById('preloader');
        if (loader) {
          // Stay on-screen for at least 1800ms to allow smooth connection animation to fully render
          setTimeout(function() {
            loader.style.opacity = '0';
            loader.style.visibility = 'hidden';
            setTimeout(function() {
              loader.style.display = 'none';
            }, 350);
          }, 1800);
        }
      });
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
